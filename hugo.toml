baseURL = 'https://cmdlhh.github.io/'
title = 'Honghui Liu'
theme = 'PaperMod'

defaultContentLanguage = 'zh'
defaultContentLanguageInSubdir = false

[languages]
[languages.zh]
languageCode = 'zh-cn'
languageName = '中文'
weight = 1

[languages.zh.params]
description = '分享个人的思考见解'
author = 'Honghui Liu'

[languages.zh.params.profileMode]
enabled = true
title = 'Honghui Liu'
subtitle = '90后，福建泉州出生，目前定居在北京，喜欢数学，热爱思考，最近几年对于股市的交易博弈感兴趣。<br><br><br><br>人生短暂，当下是最好的时代，在这个地方分享自己的一些小小的见解。'
imageUrl = '/profile.jpg'
imageWidth = 600
imageHeight = 600
imageTitle = 'Honghui Liu'
buttons = []

[[languages.zh.menu.main]]
identifier = 'home'
name = '首页'
url = '/'
weight = 1
[[languages.zh.menu.main]]
identifier = 'posts'
name = '文章'
url = '/posts/'
weight = 2
[[languages.zh.menu.main]]
identifier = 'thoughts'
name = '随想'
url = '/thoughts/'
weight = 3

[languages.en]
languageCode = 'en'
languageName = 'English'
weight = 2

[languages.en.params]
description = 'Sharing personal thoughts and insights'
author = 'Honghui Liu'

[languages.en.params.profileMode]
enabled = true
title = 'Honghui Liu'
subtitle = 'Born in the 90s in Quanzhou, Fujian, now living in Beijing. I love mathematics and thinking deeply. In recent years, I have been interested in trading games in the stock market.<br><br><br><br>Life is short, and the present is the best era. Here I share some of my small insights.'
imageUrl = '/profile.jpg'
imageWidth = 600
imageHeight = 600
imageTitle = 'Honghui Liu'
buttons = []

[[languages.en.menu.main]]
identifier = 'home'
name = 'Home'
url = '/en/'
weight = 1
[[languages.en.menu.main]]
identifier = 'posts'
name = 'Posts'
url = '/en/posts/'
weight = 2
[[languages.en.menu.main]]
identifier = 'thoughts'
name = 'Thoughts'
url = '/en/thoughts/'
weight = 3

[markup]
[markup.goldmark]
[markup.goldmark.renderer]
unsafe = true

ignoreLogs = ['warning-goldmark-raw-html']

[params]
env = 'production'
title = 'Honghui Liu'
ShowReadingTime = true
ShowShareButtons = false
ShowPostNavLinks = true
ShowBreadCrumbs = false
ShowCodeCopyButtons = true
disableSpecial1stPost = true
disableScrollToTop = false
displayFullLangName = true
ShowToc = true
TocOpen = false
hideFooter = true
mainSections = ['posts', 'thoughts']

showVisitorMap = true

[params.assets]
favicon = "favicon.svg"
favicon16x16 = "favicon-16x16.png"
favicon32x32 = "favicon-32x32.png"
apple_touch_icon = "apple-touch-icon.png"
safari_pinned_tab = "safari-pinned-tab.svg"
theme_color = "#ffffff"
msapplication_TileColor = "#ffffff"

socialIcons = [
  { name = "github", url = "https://github.com/cmdlhh" },
  { name = "douban", url = "https://www.douban.com/people/66784259" },
  { name = "zhihu", url = "https://www.zhihu.com/people/liuhonghui" },
]

