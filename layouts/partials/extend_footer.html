<!-- 访客地图 - ClustrMaps -->
{{- if site.Params.showVisitorMap }}
<div class="visitor-map" style="margin-top: 1.5rem; text-align: center;">
    <h3 style="font-size: 0.85rem; color: var(--secondary); margin-bottom: 0.75rem; font-weight: 500;">访客分布</h3>
    <a href="https://clustrmaps.com/site/1c9v0" title="查看详细统计" style="display: inline-block; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.1); transition: transform 0.2s, box-shadow 0.2s;" onmouseover="this.style.transform='translateY(-2px)';this.style.boxShadow='0 4px 12px rgba(0,0,0,0.15)';" onmouseout="this.style.transform='translateY(0)';this.style.boxShadow='0 2px 8px rgba(0,0,0,0.1)';">
        <img src="//www.clustrmaps.com/map_v2.png?d=XAr3Yb1HadqefTOKH3aYwoWaLkNlRqpda8qNjPQG_Yc&cl=ffffff" style="width: 280px; height: auto; display: block;">
    </a>
</div>
{{- end }}
